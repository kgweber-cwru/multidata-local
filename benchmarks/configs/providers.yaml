# ASR provider capability registry — docs/asr_provider_spec.md §2.
#
# Read by multidata.providers.load_providers(), which requires every field
# below to be *present* on every entry (null is a valid value; a missing key
# is not) — see that module's REQUIRED_FIELDS for the exact contract.
#
# Cloud rows were checked against the vendors' public docs on the
# `checked_on` date; where those docs contradict each other, the row's notes
# say so. Vendors ship faster than this file gets edited: recheck a row before
# a sweep that depends on it, and update `checked_on` when you do. A row with
# `verified: false` hasn't been checked; don't build against it.
#
# Local rows (faster_whisper / whisperx / whisperx_disfluent) are
# marked verified — that's not a vendor claim, it's a fact read straight off
# our own src/multidata/asr.py, so there's nothing external to check.

schema_version: 1

providers:

  faster_whisper:
    kind: local
    diarizes_internally: false      # asr._diarize_and_merge attaches pyannote afterward
    word_timings: true
    glossary_mechanism: initial_prompt   # lossy: prose, no per-term weights
    glossary_limit: null            # soft prose-length limit, not a term count
    disfluency_param: null          # no dedicated switch -- see whisperx_disfluent instead
    best_disfluency_config: null    # this engine is tuned FOR hallucination avoidance,
                                     # i.e. against disfluency retention (doc §6a) -- do
                                     # not use it as the disfluency-preservation arm
    speaker_hint_param: "diarize.diarize(num_speakers=/min_speakers=/max_speakers=)"
    formatting_off_param: null      # faster-whisper applies no smart formatting
    long_audio: null                # no vendor limit; local, compute-bound only
    baa_available: null             # not applicable -- audio never leaves this machine
    no_train_flag: null             # not applicable, same reason
    cost_per_minute: 0
    verified: true
    checked_on: "2026-08-26"
    notes: >
      Default pipeline engine (asr.DEFAULT_ENGINE). Device now auto-detects
      via multidata.device.best_ct2_device/best_ct2_compute_type -- cpu/int8
      on this Mac, cuda/float16 with no code change on an NVIDIA box.

  whisperx:
    kind: local
    diarizes_internally: true       # via whisperx.diarize.DiarizationPipeline (pyannote)
    word_timings: true              # wav2vec2 forced alignment -- arguably better than CT2's native timestamps
    glossary_mechanism: initial_prompt
    glossary_limit: null
    disfluency_param: "condition_on_previous_text (bool)"
    best_disfluency_config: null    # this is the hallucination-avoidance-tuned default;
                                     # see whisperx_disfluent for the tuned-for-disfluency sibling
    speaker_hint_param: "num_speakers/min_speakers/max_speakers -> DiarizationPipeline"
    formatting_off_param: null
    long_audio: null
    baa_available: null
    no_train_flag: null
    cost_per_minute: 0
    verified: true
    checked_on: "2026-08-26"
    notes: >
      Bundles transcribe + alignment + diarization in one call. Available via
      --engine for testing/comparison against faster_whisper.

  whisperx_disfluent:
    kind: local
    diarizes_internally: true
    word_timings: true
    glossary_mechanism: initial_prompt
    glossary_limit: null
    disfluency_param: "condition_on_previous_text=True + initial_prompt written in disfluent register"
    best_disfluency_config:
      condition_on_previous_text: true
      initial_prompt: "asr.DISFLUENCY_PROMPT"
      note: >
        Starting point -- promote implementation plan
        Phase 0.3's actual sweep winner here once it exists. Also sweep
        condition_on_previous_text=False on this same prompt before trusting
        =True on noisy audio; it's the main hallucination-loop lever, turned
        back on deliberately.
    speaker_hint_param: "num_speakers/min_speakers/max_speakers -> DiarizationPipeline"
    formatting_off_param: null
    long_audio: null
    baa_available: null
    no_train_flag: null
    cost_per_minute: 0
    verified: true
    checked_on: "2026-08-26"
    notes: >
      New: the disfluency-preservation arm (asr.transcribe_whisperx_disfluent),
      registered as its own engine rather than a flag on whisperx so a sweep
      config never accidentally flips condition_on_previous_text on the
      hallucination-avoidance-tuned default. Confirmed against the installed
      whisperx that asr_options accepts initial_prompt/
      condition_on_previous_text -- re-check if whisperx is upgraded
      (env/speech.yml doesn't pin its version).

  google:
    kind: cloud
    diarizes_internally: true       # chirp_3, BatchRecognize; diarization_config min/max_speaker_count
    word_timings: true              # enable_word_time_offsets; caps chirp_3 batch at 20 min per request
    glossary_mechanism: phrase_set
    glossary_limit: "5,000 phrases per phrase set, 100 PhraseSets per request; chirp_3 page says up to 1,000 phrases"
    disfluency_param: ITN          # Keep "Inverse Text Normalization" disabled in raw transcript output.
    best_disfluency_config: null
    speaker_hint_param: diarization_config['max_speaker_count', 'min_speaker_count']
    formatting_off_param: "enable_automatic_punctuation=false"
    long_audio:
      sync_limit_s: 60              # Recognize: "audio shorter than one minute" (chirp_3 page)
      async_path: >
        BatchRecognize, audio in GCS only. chirp_3: about 1 h per request, 20 min
        with word timestamps on (the batch page says 480 min; the chirp_3 page
        wins for chirp_3). The adapter sends 19-minute pieces (chunk_s).
    baa_available: true
    no_train_flag: "No training as long as Data Logging is disabled"
    cost_per_minute: 0.016          # not rechecked 2026-11-13 (pricing page didn't load)
    verified: true
    checked_on: 2026-11-13
    notes: >
      Adapter: multidata.transcribers.google (chirp_3 in the `us` multi-region;
      chirp_2 is regional only). Its speaker labels are linked across pieces
      through the overlaps (transcribers/chunking.py); unlinked ones are noted.
      Chirp 3 word "confidence" isn't a real confidence score (vendor's words),
      so the adapter leaves it off. Diarization and adaptation are both listed
      for chirp_3 en-US; no page shows them combined -- confirm on the first run.
      Data logging is a project-level opt-in, off by default; there is no
      per-request flag.

  google_medical_conversation:
    kind: cloud
    diarizes_internally: true       # Medical does
    word_timings: true
    glossary_mechanism: none        # the supported-languages table shows no model adaptation (2026-11-13)
    glossary_limit: null
    disfluency_param: null          # The medical models aggressivley filter disfluencies
    best_disfluency_config: null
    speaker_hint_param: diarization_config['max_speaker_count', 'min_speaker_count']
    formatting_off_param: "enable_automatic_punctuation=false"
    long_audio:
      sync_limit_s: 60
      async_path: "GCS staging, as plain google"
    baa_available: true             # TODO verify
    no_train_flag: "No training as long as Data Logging is disabled"
    cost_per_minute: 0.078
    verified: true
    checked_on: 2026-11-13
    notes: >
      Medical Conversation variant, distinct from plain Google STT above --
      aggressively filters disfluencies per Kate's research (disfluency_param
      null), which cuts directly against this project's keep-disfluencies
      policy (transcription_standards.md §1). Run it as
      `transcribers.get_transcriber("google", model="medical_conversation")`;
      offered in us, eu and global. Its batch duration limit wasn't on the
      pages read (the models overview 404'd).

  assemblyai:
    kind: cloud
    diarizes_internally: true       # speaker_labels=true (needs punctuate=true)
    word_timings: true              # milliseconds in the response
    glossary_mechanism: keyterm     # keyterms_prompt; exclusive with prompt on pre-recorded audio
    glossary_limit: "1000 terms on universal-3-5-pro, 200 on universal-2; 6 words per term"
    disfluency_param: "disfluencies (bool)"
    best_disfluency_config:
      disfluencies: true
      note: >
        The docs disagree on whether universal-3-5-pro honours `disfluencies`
        (the submit schema says yes; models.md says it is ignored and to use
        `prompt`). Compare filler counts against universal-2 before trusting it.
    speaker_hint_param: "speakers_expected, or speaker_options {min,max}_speakers_expected"
    formatting_off_param: "format_text=false"
    long_audio:
      sync_limit_s: null
      async_path: "upload (POST /v2/upload) then submit and poll; no duration limit stated"
    baa_available: "self-serve, per the pricing page (models.md says contact sales)"
    no_train_flag: >
      No per-request flag. The adapter deletes the transcript and its uploaded
      audio (DELETE /v2/transcript/{id}) once the response is saved.
    cost_per_minute: "universal-3-5-pro 0.0035 (0.21/h), universal-2 0.0025 (0.15/h); + diarization 0.02/h, keyterms 0.05/h, prompting 0.05/h, Medical Mode 0.15/h"
    verified: true
    checked_on: 2026-11-13
    notes: >
      Adapter: multidata.transcribers.assemblyai. Models are speech_models
      [universal-3-5-pro] or [universal-2]; the adapter sends exactly one, so
      the vendor can't fall back silently, and records speech_model_used.
      Medical Mode is domain="medical-v1". The vendor strips inline audio tags
      by default (remove_audio_tags). EU host: api.eu.assemblyai.com.

  elevenlabs:
    kind: cloud
    diarizes_internally: true       # diarize=true; up to 32 speakers
    word_timings: true              # timestamps_granularity=word (or character)
    glossary_mechanism: keyterm     # `keyterms`, +20% cost
    glossary_limit: "1000 terms; each at most 50 characters and 5 words; no <>{}[]\\"
    disfluency_param: "no_verbatim=false (true strips fillers and false starts)"
    best_disfluency_config:
      no_verbatim: false
    speaker_hint_param: "num_speakers (or diarization_threshold when num_speakers is unset)"
    formatting_off_param: "numbers_format=words (scribe_v3 only); no punctuation switch"
    long_audio:
      sync_limit_s: null            # one synchronous request; files to 5 GB / 15 h
      async_path: "webhook=true returns early; not used by the adapter"
    baa_available: "enterprise; scribe_v2_medical is sold as HIPAA-eligible with a BAA"
    no_train_flag: "enable_logging=false (zero-retention mode; enterprise accounts only)"
    cost_per_minute: "0.0033 (0.20/h, scribe_v2 / v2_medical / v3); keyterms +0.05/h"
    verified: true
    checked_on: 2026-11-13
    notes: >
      Adapter: multidata.transcribers.elevenlabs. Models: scribe_v3 (the
      vendor's pick for recorded audio), scribe_v2, scribe_v2_medical;
      scribe_v1 is deprecated. Audio events come back as "(laughter)"-style
      words of type audio_event; the adapter writes them as [laughter] so the
      bracket rule drops them. No per-word confidence, only logprob. The
      response doesn't say which model ran. Whether a non-enterprise account
      can use enable_logging=false is unconfirmed; the adapter sends it
      anyway, so such an account gets an error rather than a retained request.
