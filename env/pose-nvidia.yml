name: md-pose
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - rtmlib
      # - onnxruntime           # CPU; CoreML EP optional (see pipeline doc §9)
      - onnxruntime-gpu       # GPU on linux box
      - onnxruntime-gpu[cuda,cudnn]  # GPU on linux box
      - mmengine              # for the (M,T,V,C) .pkl dump format
      - opencv-python
      - numpy
      - jupyter
      - pandas
