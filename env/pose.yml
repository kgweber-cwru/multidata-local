name: md-pose
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - rtmlib
      - onnxruntime           # CoreML EP (Apple Silicon GPU/Neural Engine) by
                              # default — pose.extract(device="mps"); rtmlib
                              # falls back to CPU on its own if unavailable
      - mmengine              # pose.load() of pre-.npz float32 .pkl outputs
      - opencv-python
      - numpy
      - tqdm
      - jupyter
      - pandas
      - onnx
      - coremltools           # on macOS, for CoreML EP
      - pytest                # tests/ -- see pyproject.toml [tool.pytest.ini_options]
