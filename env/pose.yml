name: md-pose
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - rtmlib
      - onnxruntime           # CoreML EP (Apple Silicon GPU/Neural Engine) by
                              # default — pose.extract(device="mps"); rtmlib
                              # falls back to CPU on its own if unavailable
      - mmengine              # for the (M,T,V,C) .pkl dump format
      - opencv-python
      - numpy
      - tqdm
      - jupyter
      - pandas
      - onnx
      - coremltools           # on macOS, for CoreML EP
