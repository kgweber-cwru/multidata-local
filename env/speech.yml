name: md-speech
channels: [conda-forge]
dependencies:
  - python=3.11
  - ffmpeg<8            # torchcodec 0.7.0 only loads libavutil from ffmpeg 4-7
  - pip
  - pip:
      - torch
      - torchaudio            # arm64 wheels; MPS-capable
      - openai-whisper        # reference implementation (benchmark baseline)
      - faster-whisper        # CT2 backend, fast CPU int8 (portable/reproducible baseline)
      - mlx-whisper           # Apple-Silicon-native, fastest here
      - whisperx              # whisper + word alignment + diarization glue
      - pyannote.audio        # diarization (gated — huggingface-cli login + accept terms)
      - jiwer                 # WER/CER for benchmarking
      - pyannote.metrics      # DER for benchmarking
      - pympi-ling            # ELAN .eaf read/write
      - praat-parselmouth     # prosody stage: pitch/intensity/harmonicity/formants
      - soundfile
      - librosa
      - numpy
      - pandas
      - jupyter
      - python-dotenv
      - requests              # multidata.transcribers: ElevenLabs, AssemblyAI (plain HTTP)
      - google-cloud-speech   # multidata.transcribers.google (Speech-to-Text v2)
      - google-cloud-storage  # ... which reads audio only from Cloud Storage
      - google-genai          # multidata.transcribers.gemini (Gemini 3.5 Transcribe on Vertex)
      - pyyaml                # providers.yaml / glossary.yaml (multidata.providers/.glossary)
      - pytest                # tests/ -- see pyproject.toml [tool.pytest.ini_options]
